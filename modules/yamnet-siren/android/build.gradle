apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.yamnetsiren'
version = '1.0.0'

android {
  namespace "expo.modules.yamnetsiren"
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 23)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // Real, confirmed-published artifact (org.tensorflow:tensorflow-lite:2.14.0 on Maven Central)
  // -- matches the iOS side's TensorFlowLiteSwift ~> 2.14.0 so both platforms run the same real
  // TFLite runtime version against the same bundled yamnet.tflite.
  implementation "org.tensorflow:tensorflow-lite:2.14.0"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
