name: Deploy Firebase (functions, Firestore rules, Storage rules)

# Real, explicit request -- manual-only deploy (workflow_dispatch), never on push, so a deploy
# only ever happens when the project owner deliberately runs it from the GitHub app/web UI. This
# environment has no Firebase CLI / no authenticated gcloud session at all, so this workflow is
# the actual deploy path for everything server-side this session writes (Cloud Functions,
# Firestore rules, Storage rules) -- see DEPLOY.md for the one-time service-account setup this
# needs before it can run.
#
# The service account key is read ONLY from the FIREBASE_SERVICE_ACCOUNT secret below, written to a
# short-lived temp file on the runner for this run alone, and never logged, echoed, or committed
# anywhere. GitHub itself also redacts a secret's literal value from any step's log output.
on:
  workflow_dispatch:
    inputs:
      deployFunctions:
        description: "Deploy Cloud Functions"
        type: boolean
        default: true
      deployFirestoreRules:
        description: "Deploy Firestore rules"
        type: boolean
        default: true
      deployStorageRules:
        description: "Deploy Storage rules"
        type: boolean
        default: true
      updateApiKeys:
        description: "Copy API keys from this repo's GitHub secrets into Firebase (tick after adding or changing one)"
        type: boolean
        default: false
      refreshSchoolZones:
        description: "After deploying functions, load the official NSW school zones now (instead of waiting for Monday)"
        type: boolean
        default: true
  # Also: a push to the session branch whose commit message contains [firebase-deploy] deploys
  # functions + Firestore rules/indexes + Storage rules (keys left as they are, no school-zone
  # refresh). workflow_dispatch only works for workflows on the default branch, and the project
  # owner asked for the deploy to be run from here. Any other push does nothing.
  push:
    branches: [claude/go-session-0d5bup]

jobs:
  # The Firestore/Storage rules and Cloud Functions tests, on the real emulators, with placeholder
  # keys only. If any test fails, nothing is deployed.
  emulator-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[firebase-deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install functions and test dependencies
        run: |
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/tests
      - name: Placeholder secrets for the Functions emulator (not real keys)
        run: |
          printf 'MAPBOX_SERVER_TOKEN=emulator-placeholder\nELEVENLABS_API_KEY=unset\nTFNSW_API_KEY=unset\nCARJAM_API_KEY=emulator-placeholder\nAUCN_API_KEY=emulator-placeholder\nMOTORWEB_API_KEY=emulator-placeholder\nEQUIFAX_API_KEY=emulator-placeholder\nPPSR_API_KEY=emulator-placeholder\nPPSR_BUSINESSAPI_KEY=emulator-placeholder\nGOOGLE_PLACES_SERVER_KEY=emulator-placeholder\nANTHROPIC_API_KEY=emulator-placeholder\nTWILIO_ACCOUNT_SID=emulator-placeholder\nTWILIO_AUTH_TOKEN=emulator-placeholder\nTWILIO_FROM_NUMBER=emulator-placeholder\nSENTRY_AUTH_TOKEN=emulator-placeholder\nFUELCHECK_API_KEY=emulator-placeholder\nFUELCHECK_API_SECRET=emulator-placeholder\n' > firebase/functions/.secret.local
      # The functions' non-secret parameters (defineString), set to the defaults in index.js.
      # Without them the emulator stops to ask for each value and the job hangs.
      - name: Function parameters for the emulator (the code's own defaults)
        run: |
          printf 'ELEVENLABS_MODEL=eleven_multilingual_v2\nELEVENLABS_VOICE_MATILDA=XrExE9yKIg1WjnnlVkGX\nELEVENLABS_VOICE_FOOTY_FAN=IKne3meq5aSn9XLyUdCD\nELEVENLABS_VOICE_SARCASTIC_COPILOT=onwK4e9ZLuTAKqWW03F9\nELEVENLABS_VOICE_DRY_WIT=JBFqnCBsd6RMkjVDRZzb\n' > firebase/functions/.env.local
      - name: Rules + Cloud Functions tests on the emulators
        run: npx -y firebase-tools@14 emulators:exec --project demo-trackline-rules-test --only firestore,storage,functions,auth "npm --prefix firebase/tests test"

  deploy:
    needs: emulator-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Manual run: the ticked boxes. Marked push: functions + rules, nothing else.
      DEPLOY_FUNCTIONS: ${{ github.event_name == 'push' || inputs.deployFunctions }}
      DEPLOY_FIRESTORE: ${{ github.event_name == 'push' || inputs.deployFirestoreRules }}
      DEPLOY_STORAGE: ${{ github.event_name == 'push' || inputs.deployStorageRules }}
      COPY_KEYS: ${{ github.event_name != 'push' && inputs.updateApiKeys }}
      REFRESH_ZONES: ${{ github.event_name != 'push' && inputs.refreshSchoolZones }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install functions dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Write service account key to a temp file
        run: |
          # Say plainly when the secret isn't there (never prints the value).
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT repository secret is empty or missing. Add it in GitHub: Settings > Secrets and variables > Actions > New repository secret (see DEPLOY.md). Nothing was deployed."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Resolve Firebase project ID from the service account key
        id: project
        run: |
          PROJECT_ID=$(node -e "console.log(require('$RUNNER_TEMP/firebase-service-account.json').project_id)")
          echo "id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Build the --only target list
        id: targets
        run: |
          TARGETS=""
          if [ "$DEPLOY_FUNCTIONS" = "true" ]; then TARGETS="functions"; fi
          if [ "$DEPLOY_FIRESTORE" = "true" ]; then
            TARGETS="${TARGETS:+$TARGETS,}firestore:rules,firestore:indexes"
          fi
          if [ "$DEPLOY_STORAGE" = "true" ]; then
            TARGETS="${TARGETS:+$TARGETS,}storage"
          fi
          if [ -z "$TARGETS" ]; then
            echo "Nothing selected to deploy -- re-run with at least one target enabled." >&2
            exit 1
          fi
          echo "list=$TARGETS" >> "$GITHUB_OUTPUT"

      # API keys the Cloud Functions read as Firebase secrets.
      #
      # Each one can be supplied as a GitHub secret of the same name on this repo (Settings >
      # Secrets and variables > Actions) and copied into Firebase by running this workflow with
      # "Copy API keys" ticked. That's the whole process -- no command line needed.
      #
      #   MAPBOX_SERVER_TOKEN  required for road-snapped Trackys
      #   ELEVENLABS_API_KEY   optional: unlocks the character voices
      #   TFNSW_API_KEY        optional: unlocks live NSW traffic
      #   CARJAM_API_KEY       optional: vehicle full check -- details, rego, stolen, written-off
      #   AUCN_API_KEY         optional: vehicle full check -- PPSR, written-off, stolen, odometer
      #   MOTORWEB_API_KEY     optional: vehicle full check -- rego, stolen, written-off
      #   EQUIFAX_API_KEY      optional: vehicle full check -- odometer, written-off, stolen
      #   PPSR_API_KEY         optional: vehicle full check -- PPSR (B2G)
      #   PPSR_BUSINESSAPI_KEY optional: vehicle full check -- PPSR via BusinessAPI (already integrated)
      #   GOOGLE_PLACES_SERVER_KEY optional: popularity ranking for brand badges (Places API, New)
      #   ANTHROPIC_API_KEY    optional: the support dashboard's AI assistant (ticket summaries)
      #   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM_NUMBER optional: SMS codes for
      #                        account recovery (without them SMS codes are queued, not sent)
      #   SENTRY_AUTH_TOKEN    optional: crash-free sessions % on the dashboard
      #   FUELCHECK_API_KEY / FUELCHECK_API_SECRET optional: live NSW petrol prices
      #                        (api.nsw.gov.au "Fuel API" key and secret)
      #
      # Firebase refuses to deploy a function whose secret doesn't exist at all. So for the
      # OPTIONAL keys, a placeholder value ("unset") is created if nothing is there yet -- the
      # functions recognise it and report "not set up" instead of pretending to work. A real
      # value is never overwritten by the placeholder.
      #
      # Values are passed through environment variables and piped to the CLI; they are never
      # put on a command line or echoed, and GitHub redacts them from the log regardless.
      - name: Sync API keys into Firebase secrets
        if: ${{ env.DEPLOY_FUNCTIONS == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          PROJECT_ID: ${{ steps.project.outputs.id }}
          UPDATE_KEYS: ${{ env.COPY_KEYS }}
          KEY_MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          KEY_ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          KEY_TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
          KEY_CARJAM_API_KEY: ${{ secrets.CARJAM_API_KEY }}
          KEY_AUCN_API_KEY: ${{ secrets.AUCN_API_KEY }}
          KEY_MOTORWEB_API_KEY: ${{ secrets.MOTORWEB_API_KEY }}
          KEY_EQUIFAX_API_KEY: ${{ secrets.EQUIFAX_API_KEY }}
          KEY_PPSR_API_KEY: ${{ secrets.PPSR_API_KEY }}
          KEY_PPSR_BUSINESSAPI_KEY: ${{ secrets.PPSR_BUSINESSAPI_KEY }}
          KEY_GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
          KEY_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEY_TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          KEY_TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          KEY_TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          KEY_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          KEY_FUELCHECK_API_KEY: ${{ secrets.FUELCHECK_API_KEY }}
          KEY_FUELCHECK_API_SECRET: ${{ secrets.FUELCHECK_API_SECRET }}
        run: |
          set -u
          secret_exists() {
            npx firebase-tools@latest functions:secrets:get "$1" --project "$PROJECT_ID" >/dev/null 2>&1
          }
          set_secret() {
            # $1 = name, value on stdin
            npx firebase-tools@latest functions:secrets:set "$1" --data-file - \
              --project "$PROJECT_ID" --force >/dev/null
          }
          for NAME in MAPBOX_SERVER_TOKEN ELEVENLABS_API_KEY TFNSW_API_KEY CARJAM_API_KEY AUCN_API_KEY MOTORWEB_API_KEY EQUIFAX_API_KEY PPSR_API_KEY PPSR_BUSINESSAPI_KEY GOOGLE_PLACES_SERVER_KEY ANTHROPIC_API_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_NUMBER SENTRY_AUTH_TOKEN FUELCHECK_API_KEY FUELCHECK_API_SECRET; do
            VAR="KEY_$NAME"
            VALUE="${!VAR:-}"
            if [ "$UPDATE_KEYS" = "true" ] && [ -n "$VALUE" ]; then
              if printf '%s' "$VALUE" | set_secret "$NAME"; then
                echo "$NAME: updated from the GitHub secret."
              else
                echo "::error::Could not set $NAME. The deploy service account needs the 'Secret Manager Admin' role -- see DEPLOY.md."
                exit 1
              fi
            elif secret_exists "$NAME"; then
              echo "$NAME: already set in Firebase, left as it is."
            else
              if printf 'unset' | set_secret "$NAME"; then
                echo "$NAME: not provided -- created a placeholder so the deploy can proceed. The feature stays locked until a real key is added."
              else
                echo "::warning::Could not create a placeholder for $NAME (the service account may lack 'Secret Manager Admin'). The deploy below may fail -- see DEPLOY.md."
              fi
            fi
          done

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx firebase-tools@latest deploy \
            --only "${{ steps.targets.outputs.list }}" \
            --project "${{ steps.project.outputs.id }}" \
            --non-interactive

      # Scheduled functions run from a Cloud Scheduler job Firebase creates on deploy
      # (firebase-schedule-<function>-<region>; this project's functions are in us-central1).
      # Running that job once loads the official NSW school zones now. The service account needs
      # the "Cloud Scheduler Admin" role (DEPLOY.md).
      - name: Authenticate gcloud with the same service account
        if: ${{ env.DEPLOY_FUNCTIONS == 'true' && env.REFRESH_ZONES == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: ${{ env.DEPLOY_FUNCTIONS == 'true' && env.REFRESH_ZONES == 'true' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Load the NSW school zones now (refreshSchoolZones, once)
        if: ${{ env.DEPLOY_FUNCTIONS == 'true' && env.REFRESH_ZONES == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          set -e
          STARTED=$(date +%s)000
          gcloud scheduler jobs run firebase-schedule-refreshSchoolZones-us-central1 \
            --location=us-central1 --project="$PROJECT_ID"
          echo "Triggered. Waiting for the function to write dataSources/schoolZones-AU-NSW (up to 10 min)..."
          cd firebase/functions
          node -e '
            const admin = require("firebase-admin");
            admin.initializeApp({ projectId: process.env.PROJECT_ID });
            const db = admin.firestore();
            const started = Number(process.argv[1]);
            (async () => {
              for (let i = 0; i < 60; i++) {
                const d = (await db.doc("dataSources/schoolZones-AU-NSW").get()).data();
                if (d && d.updatedAt >= started) {
                  console.log(`School zones loaded: ${d.zones} zones in ${d.tiles} tiles (${d.skipped} skipped); calendar valid to ${d.calendarValidTo}.`);
                  process.exit(0);
                }
                await new Promise((r) => setTimeout(r, 10000));
              }
              console.error("::error::refreshSchoolZones did not finish within 10 minutes. Firebase console > Functions > refreshSchoolZones > Logs shows why.");
              process.exit(1);
            })().catch((e) => { console.error("::error::" + e.message); process.exit(1); });
          ' "$STARTED"

      - name: Clean up service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
